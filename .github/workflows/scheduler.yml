name: J.A.R.V.I.S. Automated Trading Bot

on:
  schedule:
    # Runs every 15 minutes between 4:00 AM and 11:00 AM UTC (9:30 AM to 4:30 PM IST), from Friday to Monday
    - cron: '*/15 4-11 * * 5,6,0,1'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run J.A.R.V.I.S. Trading Script
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
        run: |
          python main.py
