name: J.A.R.V.I.S. Automated Trading Bot

on:
  schedule:
    # Runs Monday through Friday at 14:30 UTC (Market Open hours)
    - cron: '30 14 * * 1-5'
  workflow_dispatch: # Allows you to run it manually anytime from GitHub

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run J.A.R.V.I.S. Trading Script
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
        run: |
          python main.py
